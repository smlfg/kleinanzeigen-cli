[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeigen-cli"
version = "0.1.0"
description = "kleinanzeigen – Agent-CLI für kleinanzeigen.de: Suche, Filter, Details, lokaler Suchauftrag, Login & Chats (lesen + explizit bestätigtes Antworten)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "smlfg"}]
keywords = [
    "kleinanzeigen",
    "kleinanzeigen-cli",
    "agent",
    "scraper",
    "search",
    "kleinanzeigen-cli",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
playwright = [
    # Browser-Login via Playwright; nur nötig, wenn `login` benutzt
    # wird. Mit KLEINANZEIGEN_REFRESH_TOKEN kann man es komplett
    # umgehen.
    "playwright>=1.40",
]

[project.scripts]
kleinanzeigen = "kleinanzeigen_cli.cli:main"

[project.urls]
Homepage = "https://github.com/smlfg/kleinanzeigen-cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kleinanzeigen_cli = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
